name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy planrace
      - run: uv run pytest --cov=planrace --cov-report=term-missing
      - run: uv run planrace evidence verify results/localnet-v2/manifest.json
      - run: uv run python scripts/audit_localnet_v2.py results/localnet-v2
      - run: uv run python scripts/verify_mechanism_v2.py --require-clean-source
      - run: uv run pip-audit --format cyclonedx-json --output sbom.cdx.json
      - run: uv build
      - run: uv run detect-secrets scan --all-files --exclude-files '(^uv\.lock$|^\.git/|^\.venv/|^\.bootstrap/|^\.localnet-state/|^dashboard/node_modules/|^dashboard/\.next/|^dist/)' >/dev/null

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
